name: StatusPulse CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Code
        run: ruff check app/

      # -------------------------
      # Hadolint (Dockerfile lint)
      # -------------------------
      - name: Hadolint Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # -------------------------
      # Docker Build
      # -------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t statuspulse-app:latest .

      # -------------------------
      # TRIVY (FIXED - CLI BASED, NO ACTION DEPENDENCY)
      # -------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.70.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.70.0_Linux-64bit.deb

      - name: Trivy Image Scan
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH statuspulse-app:latest

      # -------------------------
      # Start Stack
      # -------------------------
      - name: Start Docker Compose Stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose down -v || true
          DB_PASSWORD=$DB_PASSWORD docker compose up -d --build

      # -------------------------
      # Wait for services
      # -------------------------
      - name: Wait for services
        run: sleep 25

      # -------------------------
      # Install tools
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # -------------------------
      # Integration tests (safer wait)
      # -------------------------
      - name: Wait for API readiness
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8000/health && break
            echo "waiting for service..."
            sleep 5
          done

      - name: Run Integration Tests
        run: |
          chmod +x tests/test_integration.sh
          ./tests/test_integration.sh

      # -------------------------
      # Logs always
      # -------------------------
      - name: Collect Logs
        if: always()
        run: docker compose logs > logs.txt

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs.txt
