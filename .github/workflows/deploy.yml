name: StatusPulse CD

on:
  push:
    branches: ["main"]

# -------------------------
# IMPORTANT FIX (GHCR PERMISSION)
# -------------------------
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Set SAFE IMAGE NAME (LOWERCASE FIX)
      # -------------------------
      - name: Set Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/statuspulse" >> $GITHUB_ENV

      # -------------------------
      # LOGIN TO GHCR
      # -------------------------
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # -------------------------
      # BUILD DOCKER IMAGE
      # -------------------------
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE:${{ github.sha }} .
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      # -------------------------
      # PUSH IMAGE TO GHCR
      # -------------------------
      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # -------------------------
      # DEPLOY TO EC2 VIA SSH
      # -------------------------
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |

            set -e

            IMAGE=ghcr.io/${{ github.repository_owner | toLower }}/statuspulse

            echo "Pulling latest image..."
            docker pull $IMAGE:latest

            echo "Stopping old container..."
            docker stop statuspulse || true
            docker rm statuspulse || true

            echo "Starting new container..."
            docker run -d \
              --name statuspulse \
              -p 8000:8000 \
              -e DB_HOST=postgres \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e REDIS_HOST=redis \
              -e REDIS_PORT=6379 \
              $IMAGE:latest

            echo "Waiting for service..."
            sleep 10

            echo "Running health check..."

            if curl -f http://localhost:8000/health; then
              echo "✅ DEPLOY SUCCESS"
            else
              echo "❌ DEPLOY FAILED - ROLLING BACK"

              docker stop statuspulse || true
              docker rm statuspulse || true

              docker run -d \
                --name statuspulse \
                -p 8000:8000 \
                $IMAGE:${{ github.sha }}

              exit 1
            fi
