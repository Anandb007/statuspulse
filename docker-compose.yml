services:

  postgres:
    image: postgres:16
    container_name: statuspulse-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 512m

    restart: unless-stopped

    networks:
      - statuspulse-network


  redis:
    image: redis:7
    container_name: statuspulse-redis

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 256m

    restart: unless-stopped

    networks:
      - statuspulse-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: statuspulse:latest

    container_name: statuspulse-app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    mem_limit: 512m

    restart: unless-stopped

    networks:
      - statuspulse-network


volumes:
  postgres_data:


networks:
  statuspulse-network:
    driver: bridge
